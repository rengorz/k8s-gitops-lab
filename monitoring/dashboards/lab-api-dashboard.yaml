apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-api-dashboard
  labels:
    grafana_dashboard: "1"
data:
  lab-api.json: |
    {
      "title": "k8s-gitops-lab / API",
      "uid": "k8s-gitops-lab-api",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (rate(http_requests_total{route!=\"/api/health/live\",route!=\"/api/health/ready\"}[1m]))",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, namespace) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error rate (5xx)",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (rate(http_requests_total{status=~\"5..\"}[5m]))",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Ready api pods",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (kube_deployment_status_replicas_available{deployment=\"api\"})",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Memory per api pod",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{container=\"api\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Container restarts (api)",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (kube_pod_container_status_restarts_total{container=\"api\"})",
              "legendFormat": "{{namespace}}"
            }
          ]
        }
      ]
    }
