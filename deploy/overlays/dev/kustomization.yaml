apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab-dev
resources:
  - ../../base
configMapGenerator:
  - name: api-config
    literals:
      - APP_ENV=dev
      - SHUTDOWN_DELAY_MS=5000
replicas:
  - name: api
    count: 1
patches:
  - target:
      kind: Ingress
      name: lab
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.lab.localhost
images:
  - name: ghcr.io/rengorz/k8s-gitops-lab-api
    newTag: sha-76abc4d
  - name: ghcr.io/rengorz/k8s-gitops-lab-web
    newTag: sha-76abc4d
