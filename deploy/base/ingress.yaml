apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab
spec:
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
