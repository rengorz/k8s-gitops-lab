apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  annotations:
    # The CRD comes from the monitoring app and may not exist yet on the first sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
