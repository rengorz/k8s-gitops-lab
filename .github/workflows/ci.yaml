name: ci

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/ci.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npm test ${{ matrix.app == 'web' && '-- --watch=false' || '' }}
        working-directory: apps/${{ matrix.app }}

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/k8s-gitops-lab-${{ matrix.app }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/k8s-gitops-lab-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set image tags in dev overlay
        run: |
          export TAG="sha-${GITHUB_SHA::7}"
          for app in api web; do
            IMAGE="$REGISTRY/k8s-gitops-lab-$app" yq -i \
              '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' \
              deploy/overlays/dev/kustomization.yaml
          done
          git diff
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(dev): deploy ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
